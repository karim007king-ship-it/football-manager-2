name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'build-apk.yml'
      - 'capacitor.config.json'
      - 'package.json'
      - 'www/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Validate web app files
        run: |
          test -f www/index.html
          for file in www/*.js; do node --check "$file"; done

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Add Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Set portrait orientation
        run: |
          sed -i 's/android:launchMode="singleTask"/android:launchMode="singleTask" android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk football-manager.apk

      - uses: actions/upload-artifact@v4
        with:
          name: football-manager-apk
          path: football-manager.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: APK نسخة ${{ github.run_number }}
          files: football-manager.apk
