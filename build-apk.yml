name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'
      - 'capacitor.config.json'
      - 'package.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html manifest.json icon-192.png icon-512.png www/

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Add Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Portrait mode and app icon
        continue-on-error: true
        run: |
          sed -i 's/android:launchMode="singleTask"/android:launchMode="singleTask" android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${pair%%:*}
            s=${pair##*:}
            mkdir -p android/app/src/main/res/mipmap-$d
            convert icon-512.png -resize ${s}x${s} android/app/src/main/res/mipmap-$d/ic_launcher.png
            cp android/app/src/main/res/mipmap-$d/ic_launcher.png android/app/src/main/res/mipmap-$d/ic_launcher_round.png
          done

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk football-manager.apk

      - uses: actions/upload-artifact@v4
        with:
          name: football-manager-apk
          path: football-manager.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: APK نسخة ${{ github.run_number }}
          files: football-manager.apk
