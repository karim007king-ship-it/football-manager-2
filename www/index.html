<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b141d"><meta name="description" content="مدير كرة القدم 2">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg" type="image/svg+xml">
<title>مدير كرة القدم 2</title>
<style>
:root{color-scheme:dark;--bg:#0b141d;--panel:#142432;--panel2:#1a3040;--gold:#e5b84b;--muted:#9db0bf;--green:#35c47a;--red:#ef6464}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#102333,var(--bg) 60%);color:#f4f7fa;font-family:system-ui,"Noto Sans Arabic",sans-serif;min-height:100vh}
header{padding:17px 15px;background:#0b141df2;border-bottom:1px solid #294153;position:sticky;top:0;z-index:5}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-weight:900;font-size:20px;color:var(--gold)}.sub,small,.muted{color:var(--muted);font-size:12px;line-height:1.7}
main{max-width:850px;margin:auto;padding:14px 13px 90px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.stat,.card{background:linear-gradient(145deg,var(--panel2),var(--panel));border:1px solid #294153;border-radius:15px;padding:13px}.stat small{display:block}.stat b{font-size:18px;color:var(--gold)}h2{font-size:18px;margin:9px 0 13px}.section{margin:17px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
button{font:inherit;border:0;border-radius:11px;padding:11px 12px;background:var(--gold);color:#17212a;font-weight:800;cursor:pointer}button.secondary{background:#294153;color:#fff}button.selected{background:#287b57;color:white}button:disabled,.disabled{opacity:.4;pointer-events:none}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:#0b141df5;border-top:1px solid #294153;padding:7px 3px calc(7px + env(safe-area-inset-bottom));z-index:10}nav button{background:transparent;color:var(--muted);padding:8px 5px;font-size:11px}nav button.active{color:var(--gold)}
.line,.player,.summary{display:flex;justify-content:space-between;align-items:center;gap:9px;padding:10px 0;border-bottom:1px solid #294153}.line:last-child,.player:last-child{border:0}.line small,.player small{display:block}.tiny{padding:7px 9px;font-size:11px;white-space:nowrap}.rating{font-size:19px;color:var(--gold)}.clubname{font-size:23px;color:var(--gold)}.summary{flex-wrap:wrap;font-size:12px;color:var(--muted)}.fixture{text-align:center;padding:18px;font-size:20px;color:var(--gold)}.pill{font-size:11px;color:var(--green);background:#173c32;padding:4px 8px;border-radius:20px}.tablehead,.tableline{display:grid;grid-template-columns:22px minmax(90px,1fr) repeat(4,30px) 28px;gap:4px;align-items:center;padding:8px 3px;font-size:11px;border-bottom:1px solid #294153}.tablehead{color:var(--muted)}.tableline.mine{background:#213d4c;border-radius:7px}.clubs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.clubpick{text-align:right;background:var(--panel2);color:#fff;border:1px solid #294153}.clubpick small{display:block}.meter{height:8px;background:#293e4d;border-radius:8px;overflow:hidden}.meter i{display:block;height:100%;background:var(--green)}.positive{color:var(--green)}.negative{color:var(--red)}label{display:block;margin:13px 0 7px;color:var(--muted)}#toast{display:none;position:fixed;top:75px;left:12px;right:12px;background:#294153;border:1px solid #526c7d;padding:12px;border-radius:10px;z-index:20;text-align:center}#toast.show{display:block}
@media(max-width:380px){.stats{gap:5px}.stat{padding:8px}.stat b{font-size:15px}.clubs{grid-template-columns:1fr}.tablehead,.tableline{font-size:10px;grid-template-columns:18px minmax(75px,1fr) repeat(4,25px) 25px}}
</style>
</head>
<body>
<header><div class="top"><div><div class="brand">⚽ مدير كرة القدم 2</div><div class="sub">إدارة النادي · موسم احترافي</div></div><strong id="clubLabel">اختر النادي</strong></div></header>
<main id="app"></main><div id="toast"></div>
<nav>
<button data-tab="home" class="active">🏠 الرئيسية</button><button data-tab="team">👥 الفريق</button><button data-tab="market">🔄 الانتقالات</button><button data-tab="competitions">🏆 الدوري</button><button data-tab="finance">💼 المالية</button>
</nav>
<script src="game-database.js"></script><script src="game-core.js"></script><script src="game-systems.js"></script><script src="game-ui.js"></script><script src="game-systems-ui.js"></script><script src="game-match-engine.js"></script><script src="game-experience-ui.js"></script>
<script>if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));</script>
</body></html>
