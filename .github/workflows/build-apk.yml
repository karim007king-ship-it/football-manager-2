name: Build Football Manager 2 APK
on:
  workflow_dispatch:
  push:
    branches: [main, fm2-apk-foundation, fm2-full-engine, fm2-management-expansion]
    paths:
      - 'www/**'
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/workflows/build-apk.yml'
      - 'tests/**'
      - 'scripts/**'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Football Manager 2
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate game JavaScript and management systems
        run: node --check www/game-database.js && node --check www/game-core.js && node --check www/game-systems.js && node --check www/game-ui.js && node --check www/game-systems-ui.js && node --check www/game-match-engine.js && node --check www/game-experience-ui.js && python3 -m py_compile scripts/prepare-android-icons.py && node tests/database.test.cjs && node tests/core-regressions.test.cjs && node tests/systems.test.cjs && node tests/experience-ui.test.cjs && node tests/match-substitutions.test.cjs && node tests/match-tactics.test.cjs && node tests/match-ai-tactics.test.cjs
      - name: Install dependencies
        run: npm install
      - name: Add Android platform
        run: npx cap add android
      - name: Sync web game
        run: npx cap sync android
      - name: Generate Android launcher icons
        run: python3 scripts/prepare-android-icons.py
      - name: Increase Gradle distribution download timeout
        run: |
          mkdir -p android/gradle/wrapper
          if grep -q '^networkTimeout=' android/gradle/wrapper/gradle-wrapper.properties; then
            sed -i 's/^networkTimeout=.*/networkTimeout=120000/' android/gradle/wrapper/gradle-wrapper.properties
          else
            echo 'networkTimeout=120000' >> android/gradle/wrapper/gradle-wrapper.properties
          fi
      - name: Configure persistent debug signing key
        run: |
          mkdir -p "$HOME/.android"
          base64 --decode scripts/debug.keystore.b64 > "$HOME/.android/debug.keystore"
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: football-manager-2-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
